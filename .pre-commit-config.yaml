# Formatting + hygiene hooks; the formatters fix files in place. Run once after
# cloning:
#   pre-commit install
# clang-tidy needs a compile database, so it runs through the build instead
# (-DVKC_CLANG_TIDY=ON; see CONTRIBUTING.md), locally and in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # .clang-format is a multi-document file (a Cpp section and an ObjC
        # section separated by `---`), which the single-document default
        # rejects; ios configures the hook the same way.
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-format
        args: [-i, --style=file]
        types_or: [c, c++, cuda, objective-c++]
        # Pin the clang-format binary so formatting is identical locally, in
        # CI and in recon, gfx and ios, which pin the same release;
        # pre-commit installs it.
        additional_dependencies: ['clang-format==22.1.8']

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: [cmakelang, pyyaml]

  # The self-hosted runner scripts and their tests (tools/runners/); the
  # pinned shellcheck binary comes with the hook.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--external-sources]

  # First-party code includes Vulkan through
  # "volumetric_kit/core/vulkan/vulkan.hpp", never <vulkan/...> directly, so the
  # loader choice (the link-time loader today, volk later) stays a detail of
  # that one header; recon, gfx and ios run the same hook. The pattern is
  # anchored to the start of a line, so it matches real #include directives,
  # not a path quoted in a comment or a Doxygen @code block.
  - repo: local
    hooks:
      - id: vulkan-include-umbrella
        name: enforce core/vulkan/vulkan.hpp Vulkan-include umbrella
        entry: '^\s*#\s*include\s*[<"]vulkan/'
        language: pygrep
        files: \.(h|hpp|hxx|inl|ipp|c|cc|cpp|cxx|cu|cuh|mm)$
        # The reference test also includes Vulkan-Utility-Libraries' headers,
        # which it checks format.hpp against; the header-floor test includes
        # the system's to lower VK_HEADER_VERSION before vulkan.hpp checks it.
        exclude: ^(include/volumetric_kit/core/vulkan/vulkan\.hpp|tests/vulkan_format_reference_test\.cpp|tests/vulkan_header_floor\.cpp)$
