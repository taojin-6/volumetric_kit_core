name: sanitizers

# AddressSanitizer + UndefinedBehaviorSanitizer + LeakSanitizer, Linux-only
# (LeakSanitizer is not available on macOS). A green normal build is necessary
# but not sufficient: this is what turns the tests into leak, use-after-free and
# undefined-behaviour detectors. Invoked by ci.yml.
#
# TODO: the vulkan tier adds lavapipe (software Vulkan) and validation layers
# here, as recon's sanitizer job does, so device code runs sanitized too.
on:
  workflow_call:

jobs:
  asan-ubsan-lsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      # Debug + clang gives the most reliable sanitizer reports.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DVKC_SANITIZE="address;undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A consumer that builds the core as a subproject with VKC_SANITIZE: its
      # own targets must get the flags too, or linking the sanitized static
      # core fails (cmake/vkc_sanitizers.cmake).
      - name: Consume via add_subdirectory, sanitized
        run: |
          cmake -S tests/package_consumer -B build-consumer-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DVKC_CONSUME=subdirectory -DVKC_SOURCE_DIR="$PWD" \
            -DVKC_SANITIZE="address;undefined"
          cmake --build build-consumer-sanitized
          ./build-consumer-sanitized/vkc_package_consumer
