name: ci

# Umbrella CI. Every build leg, lint and sanitizers fan out from here, and the
# single `required` job at the bottom succeeds only if all of them did. Branch
# protection requires just that one check ("ci / required"), so the required
# list stays stable as legs are added or renamed.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running CI. A push to main never cancels
# another: each merged commit keeps its own full `ci / required` result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Release, static, on the family's physical GPUs: the family's CI images
      # in containers on vk-linux-gpu, and MoltenVK on the native Mac. Each
      # image is pinned by digest, the tag it was read from in a comment, so a
      # new image comes only with a commit that moves the pin. Only the owner
      # triggers workflows (DECISIONS.md).
      matrix:
        include:
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            # ghcr.io/taojin-6/volumetric_kit_ci:ubuntu-24.04
            image: ghcr.io/taojin-6/volumetric_kit_ci@sha256:14e18e23ec99fc77cb671722ec9d0f5774e124951c047f67731740441234fd6b
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            # ghcr.io/taojin-6/volumetric_kit_ci:ubuntu-26.04
            image: ghcr.io/taojin-6/volumetric_kit_ci@sha256:b39be8613b4e8140a45c98cfc23bb1f40f98300d213fdab901c3108f02df626e
          - os: macos-26
            runner: mac
            image: ''
    # The legs pull their image with the job's token.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      image: ${{ matrix.image }}

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The one status check branch protection requires. It passes only when
    # every build leg, lint and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports and would
    # block every merge.
    needs: [build, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
