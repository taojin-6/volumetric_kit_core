name: ci

# Umbrella CI. Every build leg, lint and sanitizers fan out from here, and the
# single `required` job at the bottom succeeds only if all of them did. Branch
# protection requires just that one check ("ci / required"), so the required
# list stays stable as legs are added or renamed.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running CI. A push to main never cancels
# another: each merged commit keeps its own full `ci / required` result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Release, static, on the family's physical GPUs: Ubuntu userlands in
      # containers on vk-linux-gpu, and MoltenVK on the native Mac. The Linux
      # container needs the graphics driver capabilities, bounded fan-out (a
      # runner's .env does not enter it), and a persistent shader-cache path.
      # Only the owner triggers workflows (DECISIONS.md).
      matrix:
        include:
          - os: ubuntu-24.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:24.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4","__GL_SHADER_DISK_CACHE_PATH":"/__w/_tool/nvidia-glcache","__GL_SHADER_DISK_CACHE_SKIP_CLEANUP":"1"}}'
          - os: ubuntu-26.04
            runner: vk-linux-gpu
            container: '{"image":"ubuntu:26.04","options":"--gpus all","env":{"NVIDIA_DRIVER_CAPABILITIES":"all","CMAKE_BUILD_PARALLEL_LEVEL":"4","CTEST_PARALLEL_LEVEL":"4","__GL_SHADER_DISK_CACHE_PATH":"/__w/_tool/nvidia-glcache","__GL_SHADER_DISK_CACHE_SKIP_CLEANUP":"1"}}'
          - os: macos-26
            runner: mac
            container: ''
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      container: ${{ matrix.container }}

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The one status check branch protection requires. It passes only when
    # every build leg, lint and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports and would
    # block every merge.
    needs: [build, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
