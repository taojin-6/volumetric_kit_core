name: ci

# Umbrella CI. Every build leg, lint and sanitizers fan out from here, and the
# single `required` job at the bottom succeeds only if all of them did. Branch
# protection requires just that one check ("ci / required"), so the required
# list stays stable as legs are added or renamed.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running CI. A push to main never cancels
# another: each merged commit keeps its own full `ci / required` result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # GitHub-hosted runners: the Linux legs run the vulkan tier's device
      # tests on lavapipe (Mesa's software Vulkan), required rather than
      # skipped; macOS runs them on whatever device MoltenVK finds there. Legs
      # are listed explicitly: a matrix `include` that matches an existing
      # os/build_type pair would extend that leg rather than add one.
      #
      # TODO: add the GPU legs recon runs -- Ubuntu containers on the
      # self-hosted `vk-linux-gpu` box and the self-hosted `mac` -- once those
      # runners are registered for this repository (runners on a personal
      # account are per repository). This repository is public, so those legs
      # must keep recon's guard and run only same-repository code.
      matrix:
        include:
          - name: ubuntu-24.04 Debug
            os: ubuntu-24.04
            build_type: Debug
          - name: ubuntu-24.04 Release
            os: ubuntu-24.04
            build_type: Release
          - name: macos Debug
            os: macos-latest
            build_type: Debug
          - name: macos Release
            os: macos-latest
            build_type: Release
          # Mobile consumers build with -fno-exceptions (AGENTS.md).
          - name: ubuntu-24.04 Release -fno-exceptions
            os: ubuntu-24.04
            build_type: Release
            cxx_flags: -fno-exceptions
          # Siblings may link the core into shared libraries; the export
          # macros must hold under hidden visibility.
          - name: ubuntu-24.04 Release shared
            os: ubuntu-24.04
            build_type: Release
            shared: true
          # A consumer with no Vulkan installed (calib's headless solver):
          # the base tier alone, built, installed and consumed.
          - name: ubuntu-24.04 Release, no Vulkan
            os: ubuntu-24.04
            build_type: Release
            no_vulkan: true
    uses: ./.github/workflows/_build.yml
    with:
      os: ${{ matrix.os }}
      build_type: ${{ matrix.build_type }}
      cxx_flags: ${{ matrix.cxx_flags || '' }}
      shared: ${{ matrix.shared || false }}
      vulkan: ${{ !matrix.no_vulkan }}

  lint:
    uses: ./.github/workflows/lint.yml

  sanitizers:
    uses: ./.github/workflows/sanitizers.yml

  required:
    # The one status check branch protection requires. It passes only when
    # every build leg, lint and sanitizers succeeded, and FAILS (never skips)
    # on any other outcome: a skipped required check never reports and would
    # block every merge.
    needs: [build, lint, sanitizers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "sanitizers=${{ needs.sanitizers.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.sanitizers.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi
