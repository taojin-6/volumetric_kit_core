name: lint

# Lint gate: the workflows' triggers, the pre-commit hooks (formatting,
# hygiene, shellcheck), clang-tidy through the build, and the tests of the
# runner tooling in tools/runners/, of the homebrew-key and deps-key actions,
# of the tools in tools/github/ and of the DeckLink SDK's files in tools/ci/.
# No job pushes, so no checkout keeps a token.
# The formatters' output is deterministic across operating systems, so they run
# on Linux alone; the tooling's tests also run on macOS, whose bash (3.2) the
# runner scripts must work with. Invoked by ci.yml; its `lint` result covers
# every job.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No workflow is triggered by an event an outsider can cause, or by a
      # schedule (tools/runners/README.md, "Who can trigger CI").
      - uses: ./.github/actions/check-workflow-triggers
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # Cache pre-commit's hook environments (incl. the pinned clang-format),
      # keyed on the config so they are rebuilt only when it changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-
      # Pin the runner so a new pre-commit release cannot change the gate's
      # behavior without a commit here.
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --all-files --show-diff-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The same release as the pinned clang-format (.pre-commit-config.yaml).
      - run: python -m pip install clang-tidy==22.1.8
      # The vulkan tier's headers and loader, so it is linted too, and glslc
      # for the compute tests' shaders.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc \
            spirv-tools
      # clang++ so the compile commands clang-tidy replays are a clang's.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DVKC_CLANG_TIDY=ON
      - name: Build (clang-tidy runs on every first-party file)
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

  runner-tooling:
    name: runner tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Under the system's bash: 3.2 on macOS.
      - run: /bin/bash tools/runners/tests/test_runner_scripts.sh
      - run: /bin/bash tools/runners/tests/test_homebrew_key.sh
      - run: /bin/bash tools/runners/tests/test_deps_key.sh
      - run: python3 -B -m unittest discover -s tools/github -p 'test_*.py' -v
      - run: python3 -B -m unittest discover -s tools/ci -p 'test_*.py' -v
      # The actions as a sibling uses them: on Linux no Homebrew key or
      # prefix, on macOS those of the runner's Homebrew; the packages are
      # read on Linux alone.
      - id: brew
        uses: ./.github/actions/homebrew-key
        with:
          formulae: cmake pkgconf
      - id: deps
        uses: ./.github/actions/deps-key
        with:
          brew: ${{ steps.brew.outputs.key }}
          packages: libc6-dev
      - name: Check the actions' outputs
        env:
          KEY: ${{ steps.brew.outputs.key }}
          BREW_PREFIX: ${{ steps.brew.outputs.prefix }}
          DEPS: ${{ steps.deps.outputs.prefix }}
        run: |
          hex() { printf '%s\n' "$1" | grep -Eqx "[0-9a-f]{$2}"; }
          case "$RUNNER_OS" in
            macOS) hex "$KEY" 16 && [ "$BREW_PREFIX" = "$(brew --prefix)" ] ;;
            *) [ "$KEY" = none ] && [ -z "$BREW_PREFIX" ] ;;
          esac || {
            echo "::error::unexpected Homebrew key '$KEY' or prefix '$BREW_PREFIX' on $RUNNER_OS"
            exit 1
          }
          tc="${DEPS#"brew$KEY-tc"}"
          ws="${tc#*-ws}"
          tc="${tc%-ws*}"
          if ! { [ "$DEPS" = "brew$KEY-tc$tc-ws$ws" ] && hex "$tc" 12 && hex "$ws" 12; }; then
            echo "::error::unexpected dependency key prefix '$DEPS' on $RUNNER_OS"
            exit 1
          fi
      # Their failure path, as a sibling's step meets it: a formula not
      # installed (read on macOS alone) and a compiler not on PATH each fail
      # the step, with no output. Their error annotations are expected.
      - id: brew-fails
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: ./.github/actions/homebrew-key
        with:
          formulae: cmake no-such-formula-vkc
      - id: deps-fails
        continue-on-error: true
        uses: ./.github/actions/deps-key
        with:
          compiler: no-such-c++
      - name: Check that the failing calls failed
        env:
          BREW: ${{ steps.brew-fails.outcome }}/${{ steps.brew-fails.outputs.key }}${{ steps.brew-fails.outputs.prefix }}
          DEPS: ${{ steps.deps-fails.outcome }}/${{ steps.deps-fails.outputs.prefix }}
        run: |
          want_brew=failure/
          [ "$RUNNER_OS" = macOS ] || want_brew=skipped/
          if [ "$BREW" != "$want_brew" ] || [ "$DEPS" != failure/ ]; then
            echo "::error::homebrew-key gave '$BREW', not '$want_brew'; deps-key '$DEPS', not 'failure/'"
            exit 1
          fi
