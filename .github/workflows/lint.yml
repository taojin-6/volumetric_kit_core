name: lint

# Lint gate: the pre-commit hooks (formatting, hygiene, shellcheck), clang-tidy
# through the build, and the tests of the runner tooling in tools/runners/ and
# of the homebrew-key action.
# The formatters' output is deterministic across operating systems, so they run
# on Linux alone; the tooling's tests also run on macOS, whose bash (3.2) the
# runner scripts must work with. Invoked by ci.yml; its `lint` result covers
# every job.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Cache pre-commit's hook environments (incl. the pinned clang-format),
      # keyed on the config so they are rebuilt only when it changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-
      # Pin the runner so a new pre-commit release cannot change the gate's
      # behavior without a commit here.
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --all-files --show-diff-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The same release as the pinned clang-format (.pre-commit-config.yaml).
      - run: python -m pip install clang-tidy==22.1.8
      # The vulkan tier's headers and loader, so it is linted too, and glslc
      # for the compute tests' shaders.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc \
            spirv-tools
      # clang++ so the compile commands clang-tidy replays are a clang's.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DVKC_CLANG_TIDY=ON
      - name: Build (clang-tidy runs on every first-party file)
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

  runner-tooling:
    name: runner tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Under the system's bash: 3.2 on macOS.
      - run: /bin/bash tools/runners/tests/test_runner_scripts.sh
      - run: /bin/bash tools/runners/tests/test_homebrew_key.sh
      # The action as a sibling uses it: "none" on Linux, and on macOS a key
      # from the runner's Homebrew.
      - id: brew
        uses: ./.github/actions/homebrew-key
        with:
          formulae: cmake pkgconf
      - name: Check the action's key
        env:
          KEY: ${{ steps.brew.outputs.key }}
        run: |
          case "$RUNNER_OS" in
            macOS) printf '%s\n' "$KEY" | grep -Eqx '[0-9a-f]{16}' ;;
            *) [ "$KEY" = none ] ;;
          esac || {
            echo "::error::unexpected Homebrew key '$KEY' on $RUNNER_OS"
            exit 1
          }
