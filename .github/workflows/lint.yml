name: lint

# Styling gate. Runs the same hooks as the local `pre-commit` install.
# Linux-only: clang-format and cmake-format output is deterministic across
# operating systems, so one runner is enough. Invoked by ci.yml.
on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Cache pre-commit's hook environments (incl. the pinned clang-format),
      # keyed on the config so they are rebuilt only when it changes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-
      # Pin the runner so a new pre-commit release cannot change the gate's
      # behavior without a commit here.
      - run: python -m pip install pre-commit==4.6.2
      - run: pre-commit run --all-files --show-diff-on-failure
