name: build

# One build leg, Release and static as the siblings build the core: configure,
# build and test, then build the base tier alone. Invoked by ci.yml, which owns
# the triggers and the matrix.
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    # Every leg builds the vulkan tier and runs its device tests: Linux on
    # lavapipe, macOS on the runner's device through MoltenVK. The test policy
    # (README.md, "Build and test"): no device, the layer missing, or a
    # validation error fails a test, under synchronization validation and,
    # where the layer has them, shader-access checks.
    env:
      VKC_REQUIRE_VULKAN_DEVICE: '1'
      VKC_TEST_VALIDATION: '1'
      VKC_TEST_SYNC_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Install Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # glslc and spirv-val compile and validate the compute tests' shaders.
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools vulkan-validationlayers glslc \
            spirv-tools
          # lavapipe, Mesa's software Vulkan driver, installed WITH recommends:
          # without them its runtime libraries (LLVM) are stripped and it loads
          # as INCOMPATIBLE_DRIVER, which would skip every device test.
          sudo apt-get install -y mesa-vulkan-drivers
          icd=""
          for f in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            [ -e "$f" ] && { icd="$f"; break; }
          done
          [ -n "$icd" ] || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary

      - name: Install Vulkan (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # vulkan-utility-libraries: tests/vulkan_format_reference_test.cpp
          # checks format.hpp against it.
          brew install vulkan-headers vulkan-loader molten-vk shaderc \
            spirv-tools vulkan-validationlayers vulkan-tools \
            vulkan-utility-libraries
          # The layer's manifest names its library without a path; the Test
          # step alone searches Homebrew's lib for it, as job-wide its
          # libraries would shadow those of every later tool.
          echo "VKC_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          DYLD_LIBRARY_PATH="$(brew --prefix)/lib" vulkaninfo --summary

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release -DVKC_WITH_VULKAN=ON -DVKC_WITH_CONFIG=ON \
            -DVKC_TEST_SHARDS=4

      # The level, not a bare --parallel, which ignores it and runs an
      # unbounded make -j (tools/runners/README.md).
      - name: Build
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # The level, as for the build: hosted runners set none. The tests
      # labelled cmake run on ubuntu-26.04 alone (tests/CMakeLists.txt).
      - name: Test
        env:
          DYLD_LIBRARY_PATH: ${{ env.VKC_LAYER_LIBRARY_PATH }}
          LABELS: ${{ inputs.os != 'ubuntu-26.04' && '-LE cmake' || '' }}
        run: |
          # shellcheck disable=SC2086 # LABELS is zero or two arguments
          ctest --test-dir build --output-on-failure \
            --parallel "${CTEST_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}" $LABELS

      # A skip within a shard shows only in the shard's output, which ctest
      # prints only for a failure, so the skipped tests go to the job summary;
      # the fixture probes (*Probe) skip on purpose.
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || exit 0
          skipped="$(sed -n 's/^\[  SKIPPED \] \([A-Za-z][^ ]*\).*/- \1/p' "$log" | grep -v 'Probe\.' | sort -u)"
          printf '### Skipped tests\n\n%s\n' "${skipped:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Base-only build has no JSON or GPU dependency
        run: |
          cmake -S . -B build-base -DCMAKE_BUILD_TYPE=Release \
            -DVKC_WITH_VULKAN=OFF -DVKC_WITH_CONFIG=OFF -DVKC_BUILD_TESTS=OFF
          cmake --build build-base --parallel 2
          test ! -d build-base/_deps/nlohmann_json-src
