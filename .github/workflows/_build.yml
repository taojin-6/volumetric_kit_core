name: build

# One build leg, Release and static as the siblings build the core: configure,
# build and test, on the Mac the HostRing tests under ThreadSanitizer too, then
# build the base tier alone. Invoked by ci.yml, which owns the triggers and the
# matrix.
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      runner:
        description: Self-hosted GPU runner label (vk-linux-gpu or mac).
        type: string
        required: true
      container:
        description: JSON job container for Linux; empty on the native Mac.
        type: string
        default: ''

jobs:
  build:
    runs-on: [self-hosted, '${{ inputs.runner }}']
    container: ${{ inputs.container != '' && fromJSON(inputs.container) || null }}
    timeout-minutes: 30
    defaults:
      run:
        # A container otherwise runs steps under sh (dash).
        shell: bash
    # Every leg builds the vulkan tier and runs its device tests on a physical
    # GPU: Linux through the container's ICD, macOS through MoltenVK. The policy
    # (README.md, "Build and test"): no device, the layer missing, or a
    # validation error fails a test, under synchronization validation and,
    # where the layer has them, shader-access checks. The HostRing tests also
    # check the leg runs its ring path: copied on the discrete Linux GPUs, in
    # place on the Mac's unified memory.
    env:
      VKC_REQUIRE_VULKAN_DEVICE: '1'
      VKC_TEST_VALIDATION: '1'
      VKC_TEST_SYNC_VALIDATION: '1'
      VKC_EXPECT_RING_PATH: ${{ inputs.runner == 'mac' && 'in_place' || 'copied' }}
    steps:
      # The bare Ubuntu image runs as root and needs git before checkout. The
      # NVIDIA ICD also needs libXext.so.6 and libEGL.so.1 to create a device.
      # No software ICD is installed: these legs exercise discrete memory.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$__GL_SHADER_DISK_CACHE_PATH"
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git \
            cmake build-essential libvulkan-dev vulkan-tools \
            vulkan-validationlayers glslc spirv-tools libxext6 libegl1

      # Other repositories share the host; leave no token in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Homebrew is shared by the Mac's runners. Install or upgrade its
      # dependencies by hand while idle, never from a job.
      - name: Check dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v brew >/dev/null || {
            echo "::error::brew is not on this runner's PATH"
            exit 1
          }
          missing=""
          # The format reference test needs vulkan-utility-libraries.
          for pkg in cmake molten-vk vulkan-headers vulkan-loader shaderc \
              spirv-tools vulkan-validationlayers vulkan-tools \
              vulkan-utility-libraries; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error::install by hand on this runner's host, while CI is idle:${missing}"
            exit 1
          fi
          # The layer's manifest names its library without a path. Set the
          # library search path only on Vulkan commands below.
          echo "VKC_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      - name: GPU diagnostic
        run: |
          DYLD_LIBRARY_PATH="${VKC_LAYER_LIBRARY_PATH:-}" vulkaninfo --summary || {
            echo "::error::no Vulkan device visible on this GPU runner"
            exit 1
          }

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release -DVKC_WITH_VULKAN=ON -DVKC_WITH_CONFIG=ON \
            -DVKC_TEST_SHARDS=4

      # The level, not a bare --parallel, which ignores it and runs an
      # unbounded make -j (tools/runners/README.md).
      - name: Build
        run: cmake --build build --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"

      # The level comes from the runner's .env on the Mac and the container
      # env on Linux. The cmake-labelled tests run on ubuntu-26.04 alone;
      # the ios-labelled configures still run on the Mac (tests/CMakeLists.txt).
      - name: Test
        env:
          LABELS: ${{ inputs.os != 'ubuntu-26.04' && '-LE cmake' || '' }}
        run: |
          # Set DYLD_* on the command: macOS strips a step's value when
          # starting the system shell. LABELS is zero or two arguments.
          # shellcheck disable=SC2086
          DYLD_LIBRARY_PATH="${VKC_LAYER_LIBRARY_PATH:-}" \
            ctest --test-dir build --output-on-failure \
            --parallel "${CTEST_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}" $LABELS

      # A skip within a shard shows only in the shard's output, which ctest
      # prints only for a failure, so the skipped tests go to the job summary;
      # the fixture probes (*Probe) skip on purpose.
      - name: Skipped tests
        if: ${{ !cancelled() }}
        run: |
          log=build/Testing/Temporary/LastTest.log
          [ -f "$log" ] || exit 0
          skipped="$(sed -n 's/^\[  SKIPPED \] \([A-Za-z][^ ]*\).*/- \1/p' "$log" | grep -v 'Probe\.' | sort -u || true)"
          printf '### Skipped tests\n\n%s\n' "${skipped:-none}" >> "$GITHUB_STEP_SUMMARY"

      # A ring slot's lease fails its test only under ThreadSanitizer, and Apple
      # ships the libc++ on which the rule it replaced raced (DECISIONS.md,
      # "Where memory lives"). Only the ring's tests, Debug, on the sources the
      # build above fetched; the Mac installs nothing. The suppressions cover
      # the layer's and the driver's own lock order, never a race.
      - name: HostRing under ThreadSanitizer (macOS)
        if: runner.os == 'macOS'
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/tsan.supp
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
            -DVKC_SANITIZE=thread -DVKC_WITH_CONFIG=OFF \
            -DFETCHCONTENT_SOURCE_DIR_VULKANMEMORYALLOCATOR="$PWD/build/_deps/vulkanmemoryallocator-src" \
            -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/build/_deps/googletest-src"
          cmake --build build-tsan --target vkc_vulkan_host_ring_test \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL:-$(getconf _NPROCESSORS_ONLN)}"
          DYLD_LIBRARY_PATH="${VKC_LAYER_LIBRARY_PATH:-}" \
            ctest --test-dir build-tsan --output-on-failure --no-tests=error \
            -R HostRing

      - name: Base-only build has no JSON or GPU dependency
        run: |
          cmake -S . -B build-base -DCMAKE_BUILD_TYPE=Release \
            -DVKC_WITH_VULKAN=OFF -DVKC_WITH_CONFIG=OFF -DVKC_BUILD_TESTS=OFF
          cmake --build build-base --parallel 2
          test ! -d build-base/_deps/nlohmann_json-src
