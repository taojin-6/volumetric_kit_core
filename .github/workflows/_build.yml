name: build

# One build leg: configure, build and test, then install and consume the
# package the two ways the sibling repos do (find_package against the install,
# add_subdirectory against the checkout). Invoked by ci.yml, which owns the
# triggers and the matrix.
on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      build_type:
        type: string
        required: true
      shared:
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    # Every leg builds the vulkan tier and runs its device tests: Linux on
    # lavapipe, macOS on the runner's device through MoltenVK. The test policy
    # (README.md, "Build and test"): no device, the layer missing, or a
    # validation error fails a test, under synchronization validation and,
    # where the layer has them, shader-access checks.
    env:
      VKC_REQUIRE_VULKAN_DEVICE: '1'
      VKC_TEST_VALIDATION: '1'
      VKC_TEST_SYNC_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Install Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # glslc and spirv-val compile and validate the compute tests' shaders.
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev vulkan-tools vulkan-validationlayers glslc \
            spirv-tools
          # lavapipe, Mesa's software Vulkan driver, installed WITH recommends:
          # without them its runtime libraries (LLVM) are stripped and it loads
          # as INCOMPATIBLE_DRIVER, which would skip every device test.
          sudo apt-get install -y mesa-vulkan-drivers
          icd=""
          for f in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            [ -e "$f" ] && { icd="$f"; break; }
          done
          [ -n "$icd" ] || { echo "::error::lavapipe ICD not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary

      - name: Install Vulkan (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          # vulkan-utility-libraries: tests/vulkan_format_reference_test.cpp
          # checks format.hpp against it.
          brew install vulkan-headers vulkan-loader molten-vk shaderc \
            spirv-tools vulkan-validationlayers vulkan-tools \
            vulkan-utility-libraries
          # The layer's manifest names its library without a path; the Test
          # step alone searches Homebrew's lib for it, as job-wide its
          # libraries would shadow those of every later tool.
          echo "VKC_LAYER_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$(brew --prefix)/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          DYLD_LIBRARY_PATH="$(brew --prefix)/lib" vulkaninfo --summary

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DBUILD_SHARED_LIBS=${{ inputs.shared && 'ON' || 'OFF' }} \
            -DVKC_WITH_VULKAN=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          DYLD_LIBRARY_PATH: ${{ env.VKC_LAYER_LIBRARY_PATH }}
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix "$PWD/stage"

      - name: Consume via find_package
        run: |
          cmake -S tests/package_consumer -B build-consumer-package \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DVKC_CONSUME=find_package -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer-package
          env LD_LIBRARY_PATH="$PWD/stage/lib" \
            ./build-consumer-package/vkc_package_consumer

      - name: Consume via add_subdirectory
        run: |
          cmake -S tests/package_consumer -B build-consumer-subdir \
            -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} \
            -DBUILD_SHARED_LIBS=${{ inputs.shared && 'ON' || 'OFF' }} \
            -DVKC_WITH_VULKAN=ON \
            -DVKC_CONSUME=subdirectory -DVKC_SOURCE_DIR="$PWD"
          cmake --build build-consumer-subdir
          ./build-consumer-subdir/vkc_package_consumer
          # A sibling's GPU tests on the core's test support.
          DYLD_LIBRARY_PATH="${VKC_LAYER_LIBRARY_PATH:-}" \
            ./build-consumer-subdir/vkc_package_consumer_gpu_test
          DYLD_LIBRARY_PATH="${VKC_LAYER_LIBRARY_PATH:-}" \
            ./build-consumer-subdir/vkc_package_consumer_policy_test
          # Like a sibling's install: its exported library plus the core.
          cmake --install build-consumer-subdir --prefix "$PWD/stage-consumer"
