name: Homebrew key
description: >-
  A cache key for the Homebrew formulae a build uses: 16 hex digits that
  change whenever the installed version of one of them, or of anything they
  depend on, does; "none" off macOS. On macOS it fails, naming each formula
  not installed.

# tools/runners/homebrew-key.sh computes it, and tools/runners/README.md says
# how a workflow uses it. Siblings use this action by commit, which brings the
# script at that commit with it.
inputs:
  formulae:
    description: The formulae the build uses, separated by spaces or newlines.
    required: true
outputs:
  key:
    description: The key, or "none".
    value: ${{ steps.key.outputs.key }}
  prefix:
    description: Homebrew's prefix, as `brew --prefix` prints it; empty off macOS.
    value: ${{ steps.key.outputs.prefix }}
runs:
  using: composite
  steps:
    - id: key
      name: Homebrew key
      shell: bash
      env:
        FORMULAE: ${{ inputs.formulae }}
      run: |
        err="$(mktemp "${RUNNER_TEMP:-/tmp}/homebrew-key.XXXXXX")"
        status=0
        echo "::group::What the key hashes"
        # shellcheck disable=SC2086 # one argument per formula
        out="$(bash "$GITHUB_ACTION_PATH/../../../tools/runners/homebrew-key.sh" \
          --verbose --print-prefix $FORMULAE 2>"$err")" || status=$?
        cat "$err"
        echo "::endgroup::"
        if [ "$status" -ne 0 ]; then
          # Each error as an annotation, naming what is missing.
          grep '^error: ' "$err" | sed 's/^error: /::error::/' ||
            echo "::error::homebrew-key.sh failed with status $status"
          exit "$status"
        fi
        key="$(printf '%s\n' "$out" | sed -n 1p)"
        prefix="$(printf '%s\n' "$out" | sed -n 2p)"
        echo "Homebrew key: $key"
        echo "key=$key" >>"$GITHUB_OUTPUT"
        echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
